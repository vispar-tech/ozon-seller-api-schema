[project]
name = "ozon-schema-fetcher"
version = "0.1.0"
requires-python = ">=3.14,<4.0"
description = "Daily mirror of the Ozon Seller API OpenAPI schema"
authors = [{ name = "Daniil Pavlovich", email = "layred.dota2@mail.ru" }]
maintainers = [{ name = "Daniil Pavlovich", email = "layred.dota2@mail.ru" }]
readme = "README.md"
dependencies = [
  "camoufox >=0.5.6,<1",
]

[tool.poetry]
packages = [{ include = "ozon_schema_fetcher" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.1,<10"
ruff = ">=0.14.6,<1"
mypy = ">=2.3.1,<3"
pre-commit = ">=4.5.0,<5"


[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

[tool.pytest.ini_options]
addopts = "-p no:unraisableexception"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]

[tool.ruff]
target-version = "py314"
lint.select = [
    "E",     # Error
    "F",     # Pyflakes
    "W",     # Pycodestyle
    "C90",   # McCabe complexity
    "I",     # Isort
    "N",     # pep8-naming
    "D",     # Pydocstyle
    "ANN",   # Pytype annotations
    "S",     # Bandit
    "B",     # Bugbear
    "C4",    # Comprehensions
    "ISC",   # Implicit string concat
    "PIE",   # Unnecessary code
    "T20",   # Catch prints
    "PYI",   # validate pyi files
    "Q",     # Checks for quotes
    "RSE",   # Checks raise statements
    "RET",   # Checks return statements
    "SLF",   # Self checks
    "SIM",   # Simplificator
    "PTH",   # Pathlib checks
    "ERA",   # Checks for commented out code
    "PL",    # PyLint checks
    "RUF",   # Specific to Ruff checks
    "FA102", # Future annotations
    "UP",    # Python updates
]
lint.ignore = [
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "B008",    # Do not perform function calls in argument defaults
    "D211",    # No blank lines allowed before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "D202",    # No blank lines allowed after function docstring
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR0913", # Too many arguments for function call
    "PLR0917", # Too many positional arguments (companion of PLR0913)
    "D106",    # Missing docstring in public nested class
    "UP043",   # Unnecessary default argument specified (conflicts with mypy).
]
exclude = [
    ".venv/"
]
lint.mccabe = { max-complexity = 10 }
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of assert detected
    "PLC0415", # Import outside toplevel
    "RUF001",  # Ambiguous unicode: Russian fixture name in assertions
]
"ozon_schema_fetcher/__main__.py" = [
    "T201", # print — CLI status output is the program's purpose
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]
