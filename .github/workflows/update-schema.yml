name: Update schema

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schema
  cancel-in-progress: false

jobs:
  update:
    name: Fetch and commit schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: ozon-schema-fetcher:latest
          cache-from: type=gha,scope=ozon-schema-fetcher
          cache-to: type=gha,mode=max,scope=ozon-schema-fetcher
      - name: Fetch schema
        run: |
          mkdir -p schemas
          docker run --rm -v "$PWD/schemas:/schemas" ozon-schema-fetcher:latest -o /schemas/ozon-seller-api-openapi.json
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain -- schemas/ozon-seller-api-openapi.json)" ]; then
            python3 scripts/update_readme.py schemas/ozon-seller-api-openapi.json README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schemas/ozon-seller-api-openapi.json README.md
            git commit -m "chore: update schema ($(date -u +%Y-%m-%d))"
            git push
          fi
