---
# Конфиг живёт в корне репо — `pre-commit install` из git-root работает штатно.
# Poetry-проект этого репо тоже в корне, поэтому хуки cd к toplevel напрямую.
repos:
    - repo: local
      hooks:

           - id: ruff-format
             name: Format with Ruff
             entry: sh -c 'cd "$(git rev-parse --show-toplevel)" && poetry run ruff format "$@"' --
             language: system
             pass_filenames: false
             always_run: true

           - id: ruff
             name: Check with Ruff
             entry: sh -c 'cd "$(git rev-parse --show-toplevel)" && poetry run ruff check ozon_schema_fetcher tests scripts "$@"' --
             language: system
             pass_filenames: false
             always_run: true
             args: ["--fix"]

           - id: mypy
             name: Validate types with MyPy
             entry: sh -c 'cd "$(git rev-parse --show-toplevel)" && poetry run mypy "$@"' --
             language: system
             pass_filenames: false
             always_run: true
             args:
               - "ozon_schema_fetcher"
               - "tests"
               - "scripts"
